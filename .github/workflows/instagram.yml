name: Instagram followers
on:
  schedule:
    - cron: '30 21 * * *'   # every day, ~00:30 Kyiv
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/ig_followers.mjs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/followers.json
          git diff --cached --quiet || (git commit -m "followers: daily update" && git push)
