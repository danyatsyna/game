name: Instagram sync
on:
  schedule:
    - cron: '7 * * * *'   # every hour
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: instagram-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Followers
        run: node tools/ig_followers.mjs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      - name: Videos
        continue-on-error: true
        run: node tools/ig_media.mjs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/followers.json data/videos.json
          git diff --cached --quiet || (git commit -m "instagram: sync" && git pull --rebase -q && git push)
