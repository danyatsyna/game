<title>Билд Даниила</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#cfd3d6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&display=swap">
<style>
/* Layout: one 480px column on a light steel ground with diagonal light streaks. Dark charcoal panels carry data, one light panel marks the selected item, yellow is the only accent. Headings are heavy condensed italics. Single light look by design. */
:root{
  color-scheme:light;--r:12px;--r-s:8px;
  --bg:#cfd3d6;--bg-2:#e2e4e6;--bg-3:#bfc4c8;--white:#f6f7f8;
  --line:#aab0b5;--line-2:#80868c;
  --fg:#15171a;--fg-2:#43484d;--fg-3:#6f757b;
  --accent:#f5b400;--accent-ink:#161616;
  --danger:#d9432f;--ok:#2f8f49;--miss:#8d9298;--scrim:#1a1d20c7;
  --common:#6b7177;--rare:#2c86df;--epic:#8552d6;--legend:#e8711c;
  --heat1:#f1dc9b;--heat2:#f0c247;--heat3:#d79a00;
  --rank0:#b8743a;--rank1:#7f878e;--rank2:#d99b00;--rank3:#1ea592;--rank4:#2f7fe0;--rank5:#dd3a2a;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
/* dark panel: every token flips inside it, so inner rules stay the same */
.dk{border-radius:var(--r);--bg:#0000004a;--bg-2:#121417b8;--bg-3:#ffffff22;--white:#ffffff2b;--line:#ffffff2e;--line-2:#ffffff5c;--fg:#f4f5f6;--fg-2:#c8ccd0;--fg-3:#969ca2;--heat1:#6b5d2a;--heat2:#b48a16;--heat3:#f5b400;--rank1:#c6ccd2;--common:#aab0b6;--rare:#5aa6f0;--epic:#ad86f0;--legend:#ff9a4a;--rank0:#d59457;--rank2:#f5b400;--rank3:#3fd0bb;--rank4:#6fa8ff;--rank5:#ff6d5c;background:var(--bg-2);color:var(--fg)}
/* light (selected) panel */
.lt{border-radius:var(--r);--bg:#ffffff;--bg-2:#eef0f2;--bg-3:#d3d7da;--line:#b9bec3;--line-2:#8a9096;--fg:#15171a;--fg-2:#43484d;--fg-3:#6f757b;background:var(--bg-2);color:var(--fg)}
*{box-sizing:border-box}
html.locked,html.locked body{overflow:hidden}
body{
  background-color:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(112deg,#c6cacf 0 34%,#e3e5e7 34.2% 34.9%,#d7dadd 35% 58%,#c3c7cc 58.2% 58.8%,#ccd0d4 59% 78%,#dcdfe2 78.2% 78.7%,#c8ccd0 79%);
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2,h3,p{margin:0}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}

.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}

.eyebrow{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3)}
.muted{color:var(--fg-2)}
.sm{font-size:12px}
.note{font-size:13px;color:var(--fg-2);margin:4px 0 12px}
.mt{margin-top:10px}

/* banner */
.demo,.warn{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;background:#3e4246;color:#c8ccd0;font-size:13px;border-left:4px solid var(--accent);border-radius:var(--r);background:#121417b8}
.demo b{color:#f4f5f6;font-weight:600}
.warn{border-left-color:var(--danger)}

/* HUD: one translucent block — rating, rank, season + day track */
.hud-slot{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 42px);display:flex;flex-direction:column;gap:4px;padding:0 0 0 13px;box-shadow:inset 5px 0 0 var(--accent);border-radius:3px;z-index:3}
.hud-bot{position:absolute;left:16px;right:16px;bottom:10px;z-index:3;display:flex;flex-direction:column;gap:8px}
.bot-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gear svg{stroke-width:1.1!important}
.gear{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:3;width:51px;height:51px;color:#ffffffc7;filter:drop-shadow(0 1px 3px #00000066)}
.nc-fol{display:flex;align-items:center;gap:9px;text-align:left;color:#fff;white-space:nowrap}
.nc-fol b{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:21px;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.nc-rank{display:flex;align-items:center;gap:6px;text-align:left;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:19px;text-transform:uppercase;color:#fff;text-shadow:0 0 6px #000c,0 1px 2px #000a;line-height:1.1}
.hud-bot{text-shadow:0 0 6px #000c,0 1px 2px #000a}
.nc-month{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:19px;text-transform:uppercase;line-height:1.1;color:#ffffffa6;text-shadow:none;background:none;filter:none}
.hud-sep{height:1px;background:var(--line)}
.rank-btn{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;text-align:left;min-width:0;width:100%}
.rank-txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.rank-name{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:24px;line-height:1;text-transform:uppercase;letter-spacing:.01em;color:var(--rc)}
.rank-sub{font-size:12px;color:var(--fg-2);line-height:1.3}
.bar{display:block;height:6px;background:var(--bg-3);margin-top:6px;overflow:hidden;border-radius:99px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.thin{height:4px;margin-top:0}
.hud-season{display:flex;align-items:baseline;gap:10px}
.season-chip{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:21px;line-height:1;letter-spacing:.01em;text-transform:uppercase;color:var(--fg)}
.season-left{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{display:grid;gap:2px}
.track i{height:8px;background:var(--bg-3);border-radius:2px}
.track i.miss{background:var(--miss)}
.track i.hit{background:var(--accent)}
.track i.today{background:var(--fg-3)}
.track i.hit.today{background:var(--accent)}

/* Stage */
.stage{background:#8287a0;position:relative;container-type:size;margin:0 -16px;height:var(--sh,calc(100dvh - 92px));overflow:hidden}
.mir{position:absolute;top:0;bottom:0;width:60%;background:var(--hero) no-repeat;background-size:2500% 100%;filter:blur(5px);pointer-events:none;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 10%);mask-image:linear-gradient(to bottom,transparent,#000 10%)}
.mir.l{right:calc(100% - 1px);background-position:left top}
.mir.r{left:calc(100% - 1px);background-position:right top}
.art{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(100cqw,calc(100cqh * .6021));aspect-ratio:973/1616}
.hero img{display:block;width:100%;height:100%;object-fit:cover}
.hero{position:absolute;inset:0;pointer-events:none;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 10%);mask-image:linear-gradient(to bottom,transparent,#000 10%)}
.hero svg{width:100%;height:100%;display:block}
html.on-hero body{background-image:none;background-color:#5a5d72}
html.on-hero .app{gap:0;padding-block:0}
html.on-hero{overscroll-behavior:none}
html.on-hero body{padding:0;margin:0;min-height:0;overscroll-behavior:none}
html.on-hero .app{height:0;min-height:0;overflow:visible;padding:0}
html.on-hero .stage{position:fixed;left:0;right:0;top:0;bottom:var(--tb,92px);height:auto;margin:0 auto;max-width:480px}
html.on-hero #demo{position:absolute;top:8px;left:16px;right:16px;z-index:5}

.wires{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.wires .wire{fill:none;stroke:#ffffffc7;stroke-width:.8}
.wires .wire.on{stroke:var(--accent);stroke-width:1.5}
.wires .node{fill:#ffffffd9}
.wires .node.on{fill:var(--accent)}
.slot{position:absolute;left:calc(var(--x) * 1%);top:calc(var(--y) * 100% / 150);width:calc(var(--w) * 1%);height:calc(var(--h) * 100% / 150)}
.cell{display:flex;align-items:center;gap:10px;padding:0 12px 0 8px;text-align:left;transition:transform .15s ease;border-radius:3px;background:#0a0c1052;border:1px solid #ffffff33;box-shadow:0 6px 16px #0000002e;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;--cc:#fff}
.cell:active{transform:scale(.97)}
.ring{position:relative;flex:none;width:38px;height:38px;display:grid;place-items:center}
.ring>svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3}
.ring .rt{stroke:#ffffff38}
.ring .rp{stroke:var(--accent);stroke-linecap:round}
.ri{display:grid;place-items:center;color:#fff}
.cell.on .ri{color:var(--accent)}
.cell.on{border-color:var(--accent)}
.cell-lv{display:flex;flex-direction:column;align-items:flex-start;gap:2px;line-height:1;min-width:0}
.cell-lv i{font-style:normal;font-family:var(--f-display);font-weight:600;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#ffffffa6}
.cell-num{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:28px;line-height:.95;color:#fff}
.namecard{display:flex;flex-direction:column;justify-content:center;gap:0;padding:0 0 0 10px;box-shadow:inset 4px 0 0 var(--accent);border-radius:3px;min-width:0}
.nc-name{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:25px;line-height:1.05;letter-spacing:.01em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc-lvl{font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--fg-2);letter-spacing:.06em}

/* Actions */
.actions{display:flex;flex-direction:column;gap:8px}
.act-row{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 16px;background:#121417c4;font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:#f4f5f6;cursor:pointer;text-align:center;line-height:1.15;border-radius:var(--r-s)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.small{min-height:38px;font-size:14px;padding:0 12px}
.btn.wide{width:100%}
.btn.danger{background:#ffffff;color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.btn.armed,.btn.danger.armed{background:var(--danger);color:#fff;box-shadow:none}
.btn:active{transform:translateY(1px)}
.act-meta{display:flex;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;font-size:13px;color:var(--fg-2)}
.act-meta span{display:inline-flex;align-items:center;gap:5px}
.act-meta b{color:var(--fg);font-weight:600}
.act-meta .lit{color:#9a6e00}

/* Section heads */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--fg);padding-bottom:6px;margin-bottom:10px}
.sec-title{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:18px;letter-spacing:.01em;text-transform:uppercase}
.sec-count{font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--fg-2);letter-spacing:.04em}

/* Sheet */
.sheet-backdrop{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;max-height:88vh;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;background:#e9ebed;border-top:4px solid var(--accent);border-radius:var(--r) var(--r) 0 0;z-index:41;padding-top:8px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transform:translateY(24px);opacity:0;transition:transform .22s ease,opacity .22s ease}
.sheet.open{transform:none;opacity:1}
.sheet-handle{width:40px;height:4px;background:var(--line-2);margin:0 auto 10px;border-radius:2px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sheet-title{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:28px;line-height:1;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.sheet h3,.view h3{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2);margin:22px 0 8px;padding-left:0;box-shadow:none;border-radius:2px;line-height:1.1}
.view h3{margin:6px 0 -8px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;min-width:0}
.field label{font-size:12px;color:var(--fg-2)}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--white);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;width:100%;min-width:0;-webkit-appearance:none;appearance:none}
input[type=date]{min-height:44px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea{min-height:100px;font-size:13px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 8px}
.seg{display:flex;gap:2px;margin:12px 0 6px;padding:2px;border-radius:8px;background:#ffffff14}.seg button{flex:1;border:0;background:none;color:#c8ccd0;font:600 12px var(--f-display);letter-spacing:.04em;padding:6px 9px;border-radius:6px;min-height:28px}.seg button.on{background:var(--accent);color:#111}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.log{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.log li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.log .d{font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--fg-3);font-variant-numeric:tabular-nums;letter-spacing:.03em}
.log .t{min-width:0;overflow-wrap:anywhere}
.log .tl{display:block;font-family:var(--f-display);font-weight:600;font-size:11px;color:var(--fg-3);text-transform:uppercase;letter-spacing:.08em}
.log .x{font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--fg);font-variant-numeric:tabular-nums}
.del{min-width:32px;height:32px;display:grid;place-items:center;color:var(--fg-3);border:1px solid transparent}
.del.armed{color:var(--danger);border-color:var(--danger);padding:0 8px;font-size:12px}
.empty{color:var(--fg-3);font-size:13px;padding:6px 0}
.ranks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rk{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px 9px 10px;box-shadow:inset 4px 0 0 var(--rc)}
.rk .emb{display:block}
img.emb{filter:saturate(1.25) contrast(1.08) drop-shadow(0 1px 2px #0006)!important}
.rk .nm{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:20px;line-height:1.05;text-transform:uppercase;letter-spacing:.01em;color:var(--rc)}
.rk .rw{display:block;font-size:12px;color:var(--fg-2)}
.rk .st{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--fg-3);display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.rk.got .st{color:var(--fg)}
.rk.lock .nm,.rk.lock .rw,.rk.lock .st{opacity:.72}
#v-season .track i.miss{background:var(--miss);box-shadow:none}
.legend-row{display:flex;gap:14px;font-size:12px;color:var(--fg-3);margin-top:6px}
.legend-row i{display:inline-block;width:10px;height:6px;margin-right:5px;vertical-align:middle;border-radius:2px}
.lvl-big{display:flex;align-items:center;gap:14px}
.lvl-big .n{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:56px;line-height:1}
.lvl-big .tier{font-size:15px}
.lvl-big .xp{margin-left:auto;font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.counters{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:14px}
.ctr{padding:10px 12px;box-shadow:inset 4px 0 0 var(--accent)}
.ctr b{display:block;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.ctr span{font-size:12px;color:var(--fg-2)}
.pick-row{display:flex;flex-wrap:wrap;gap:8px}
.btn.pick.sel{background:var(--accent);color:var(--accent-ink)}
.pick-form{margin-top:12px;padding:12px;box-shadow:inset 4px 0 0 var(--accent);background:var(--white);border-radius:var(--r-s)}
.rank-edit{display:grid;grid-template-columns:28px minmax(0,1fr) 72px;gap:6px;align-items:center;margin-bottom:12px}
.rank-edit .rr{grid-column:2 / -1}
.sticky-save{position:sticky;bottom:0;margin-top:8px;z-index:2}
.ach-detail{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:6px 0 16px}
.ach-name{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:30px;line-height:1.05;text-transform:uppercase;letter-spacing:.01em;color:var(--fg);text-wrap:balance}
.ach-status{font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--fg-3);letter-spacing:.03em}
.tag{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase}

/* Popup */
.popup{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:var(--scrim);padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pop-card{position:relative;overflow:hidden;width:min(340px,100%);padding:24px 20px 20px;text-align:center;color:var(--pc);box-shadow:inset 0 4px 0 var(--pc);background:#121417e6;animation:popIn .4s cubic-bezier(.2,1.3,.4,1)}
.pop-rays{position:absolute;left:50%;top:112px;width:300px;height:300px;margin:-150px 0 0 -150px;background:repeating-conic-gradient(from 0deg,currentColor 0deg 5deg,transparent 5deg 22.5deg);opacity:.14;-webkit-mask:radial-gradient(closest-side,#000 25%,transparent);mask:radial-gradient(closest-side,#000 25%,transparent);animation:spin 18s linear infinite;pointer-events:none}
.pop-glow{position:absolute;left:50%;top:112px;width:140px;height:140px;margin:-70px 0 0 -70px;border-radius:50%;background:currentColor;filter:blur(40px);opacity:.3;pointer-events:none}
.pop-eyebrow{position:relative;font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.18em;text-transform:uppercase}
.pop-badge{position:relative;display:flex;justify-content:center;margin:14px 0 6px;animation:badgeIn .6s cubic-bezier(.2,1.3,.4,1) .08s both}
.pop-lvl{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:104px;height:104px;border:2px solid currentColor;border-radius:50%;background:var(--bg)}
.pop-lvl b{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:34px;line-height:1;color:var(--fg)}
.pop-title{position:relative;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:30px;line-height:1.05;text-transform:uppercase;letter-spacing:.01em;color:var(--fg);margin:6px 0 2px;text-wrap:balance}
.pop-desc{position:relative;color:var(--fg-2);font-size:14px;margin-bottom:6px}
.pop-reward{position:relative;border-top:1px solid var(--line);margin-top:12px;padding-top:12px;color:var(--fg);font-size:15px}
.pop-card .btn.primary{position:relative;background:var(--pc);color:#15171a}
@keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes badgeIn{from{transform:scale(.4) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}

/* Views & tab bar */
.view{display:flex;flex-direction:column;gap:18px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.view-title{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:40px;line-height:.95;letter-spacing:-.005em;text-transform:uppercase}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#e3e5e7;border-radius:16px 16px 0 0;border-top:1px solid #f4f5f6;box-shadow:0 -6px 18px #0000001f;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabbar-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:6px 0}
.tab{padding:12px 0 12px!important}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;color:var(--fg-2);font-family:var(--f-display);font-weight:600;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;min-width:0}
.tab{border-radius:var(--r-s)}
.tab.on{color:var(--fg);background:var(--white)}
.tab.on::before{content:"";position:absolute;bottom:4px;left:30%;right:30%;height:3px;border-radius:2px;background:var(--accent)}
.tab-cnt{position:absolute;top:4px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-size:11px;font-weight:700;line-height:16px;letter-spacing:0;text-align:center;border-radius:8px}
.link{display:inline-flex;align-items:center;gap:2px;color:var(--fg);font-size:13px}

/* Tasks */
.task-add{display:flex;flex-direction:column;gap:8px}
.task-add .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.task-add .note{margin:0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:0 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:5px;padding:7px 10px;background:#ffffff8a;border-radius:99px;font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-2)}
.chip b{font-family:var(--f-display);font-size:12px;color:var(--fg-3);font-weight:700}
.chip.on{background:#15171a;color:#fff}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 6px 10px 12px;box-shadow:inset 4px 0 0 var(--line-2)}
.chk{width:28px;height:28px;border:1.5px solid var(--line-2);display:grid;place-items:center;color:transparent;background:var(--bg);border-radius:7px}
.chk:active{transform:scale(.9)}
.task.done{box-shadow:inset 4px 0 0 var(--accent)}
.task.done .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.task-main{min-width:0}
.task-txt{overflow-wrap:anywhere;font-size:15px;line-height:1.35;font-weight:500}
.task.done .task-txt{color:var(--fg-3);text-decoration:line-through;font-weight:400}
.task-meta{display:flex;align-items:center;flex-wrap:wrap;gap:5px;font-size:12px;color:var(--fg-3);margin-top:3px}
.task-meta .xp{color:var(--accent);font-family:var(--f-display);font-weight:700;font-size:13px}
.task.done .task-meta .xp{color:#9a6e00}
.tprog{display:flex;flex-direction:column;gap:8px;padding:12px}
.tprog-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.03em;text-transform:uppercase;color:var(--fg-2)}
.tprog-top b{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:20px;color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}
.tprog .bar{height:10px;margin-top:0}

/* Analytics */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{padding:10px;min-width:0;display:flex;flex-direction:column;gap:2px;box-shadow:inset 0 3px 0 var(--accent)}
.tile b{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:11.5px;color:var(--fg-2);line-height:1.3}
.tile .k{font-family:var(--f-display);font-weight:600;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.card{padding:14px}
.view .card-title{margin:0;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:19px;line-height:1.05;letter-spacing:.01em;text-transform:uppercase;color:var(--fg);padding:0;border:0;box-shadow:none}
.card-sub{font-size:12px;color:var(--fg-3);margin-top:3px}
.chart{display:block;width:100%;height:auto;margin-top:10px;overflow:visible}
.chart text{font-family:var(--f-display);font-weight:600;font-size:11px;fill:var(--fg-3)}
.chart text.strong{fill:var(--fg);font-weight:700}
.chart text.name{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;fill:var(--fg-2)}
.chart .grid{stroke:var(--line);stroke-width:1;fill:none}
.chart .axis{stroke:var(--line-2);stroke-width:1}
.chart .bar{fill:var(--line-2)}
.chart .bar.cur{fill:var(--accent)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .radar{fill:var(--accent);fill-opacity:.2;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.chart .dot{fill:var(--accent);stroke:var(--bg-2);stroke-width:2}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);fill-opacity:.12}
.chart .dot-s{fill:var(--fg-3);stroke:var(--bg-2);stroke-width:2}
.chart .ghost{fill:none;stroke:var(--fg-2);stroke-width:1.5;stroke-dasharray:4 3}
.chart .gdot{fill:var(--bg-2);stroke:var(--fg-2);stroke-width:1.5}
.chart .today{stroke:var(--line-2);stroke-width:1;stroke-dasharray:2 3}
.fol-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin-top:8px}
.fol-num{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.delta{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-display);font-weight:700;font-size:15px}
.delta.up{color:#7fd48f}.delta.down{color:#ff8a78}.delta.flat{color:var(--fg-3)}
.delta small{font-family:var(--f-body);font-weight:400;color:var(--fg-3);font-size:12px}
.card details{margin-top:10px;font-size:13px}
.card summary{cursor:pointer;color:var(--fg-2);padding:4px 0}
.card .row-btns{margin-top:12px}
.card .btn{background:var(--white);color:var(--fg)}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--fg-2);margin-top:10px}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{display:inline-block;width:18px;height:0;border-top:2px solid var(--accent)}
.lg i.g{border-top:1.5px dashed var(--fg-2)}
.card-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pace{display:flex;flex-direction:column;align-items:flex-end;text-align:right;flex:none}
.pace b{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.pace span{font-size:11.5px;color:var(--fg-2);line-height:1.3}
.heat{display:grid;grid-template-columns:20px repeat(12,minmax(0,1fr));gap:3px;margin-top:12px}
.heat i{aspect-ratio:1;background:var(--bg-3);border-radius:3px}
.heat .h1{background:var(--heat1)}.heat .h2{background:var(--heat2)}.heat .h3{background:var(--heat3)}
.heat .hf{background:none;box-shadow:inset 0 0 0 1px var(--line)}
.heat .hl{font-family:var(--f-display);font-weight:600;font-size:10px;color:var(--fg-3);align-self:center}
.heat-legend{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:11px;color:var(--fg-3);margin-top:8px}
.heat-legend i{width:10px;height:10px;display:inline-block;background:var(--bg-3);border-radius:3px}
.heat-legend .h1{background:var(--heat1)}.heat-legend .h2{background:var(--heat2)}.heat-legend .h3{background:var(--heat3)}
.hbars{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.hbar{display:grid;grid-template-columns:76px minmax(0,1fr) 56px;gap:8px;align-items:center;font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.03em;text-transform:uppercase;color:var(--fg-2)}
.hbar .tr{height:10px;background:var(--bg-3);border-radius:99px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--line-2);border-radius:99px}
.hbar.cur .tr i{background:var(--accent)}
.hbar b{font-family:var(--f-display);font-weight:700;text-align:right;color:var(--fg);font-variant-numeric:tabular-nums}
.tip{position:fixed;z-index:50;background:#15171a;color:#f4f5f6;font-size:12px;padding:6px 8px;border-radius:6px;pointer-events:none;white-space:nowrap;transform:translate(-50%,calc(-100% - 8px))}

/* Trophies */
.ach-sum{display:flex;flex-wrap:wrap;gap:6px}
.ach-sum span{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase;padding:5px 9px;background:#ffffff8a;border-radius:99px;color:var(--fg-2)}
.ach-sum i{width:8px;height:8px;display:inline-block;border-radius:50%}
.ach-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ach-card{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;padding:10px;text-align:left;color:var(--tc);min-width:0;box-shadow:inset 0 -4px 0 var(--line)}
.ach-card.un{box-shadow:inset 0 -4px 0 var(--tc)}
.ach-card:not(.un) .badge{opacity:.45}
.ach-card.un .badge{filter:drop-shadow(0 0 5px var(--tc))}
.ac-txt{min-width:0;display:flex;flex-direction:column}
.ach-card .nm{font-size:13px;color:var(--fg);line-height:1.25;overflow-wrap:anywhere;font-weight:500}
.ach-card:not(.un) .nm{color:var(--fg-2)}
.ach-card .rr{font-family:var(--f-display);font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--rc2);margin-top:2px}
.ach-card .pg{font-family:var(--f-display);font-weight:600;font-size:12px;color:var(--fg-3);margin-top:4px;font-variant-numeric:tabular-nums}
.ach-card .bar{height:4px;margin-top:3px}
.ach-card .bar i{background:var(--rc2)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:#15171a;color:#f4f5f6;padding:10px 16px;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 24px #00000055;border-radius:var(--r-s)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

var MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
var MONTHS_IN=['январе','феврале','марте','апреле','мае','июне','июле','августе','сентябре','октябре','ноябре','декабре'];
function pad(n){return String(n).padStart(2,'0');}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function dayNum(s){var p=s.split('-').map(Number);return Math.round(Date.UTC(p[0],p[1]-1,p[2])/864e5);}
function fromDayNum(n){var d=new Date(n*864e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());}
function addDays(s,n){return fromDayNum(dayNum(s)+n);}
function fmtDate(s){var p=s.split('-');return p[2]+'.'+p[1];}
function fmtFull(s){var p=s.split('-');return p[2]+'.'+p[1]+'.'+p[0];}
function fmt(n){return Number(n||0).toLocaleString('ru-RU');}
function signed(n){return (n>0?'+':n<0?'−':'±')+fmt(Math.abs(n));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function plural(n,f){n=Math.abs(n)%100;var n1=n%10;if(n>10&&n<20)return f[2];if(n1>1&&n1<5)return f[1];if(n1===1)return f[0];return f[2];}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function clampInt(v,min,max,def){var n=parseInt(String(v==null?'':v).replace(/\s/g,''),10);if(isNaN(n))return def;return Math.min(max,Math.max(min,n));}
function parseNum(v){var n=Number(String(v==null?'':v).replace(/\s/g,'').replace(',','.'));return isFinite(n)&&n>0?Math.round(n):0;}
function byDateDesc(a,b){if(a.date!==b.date)return a.date<b.date?1:-1;return a.id<b.id?1:-1;}
/* months: a season is a calendar month, key 'YYYY-MM' */
function curKey(){return todayStr().slice(0,7);}
function keyStart(k){return k+'-01';}
function nextKey(k){var y=+k.slice(0,4),m=+k.slice(5,7)+1;if(m>12){m=1;y++;}return y+'-'+pad(m);}
function prevKey(k){var y=+k.slice(0,4),m=+k.slice(5,7)-1;if(m<1){m=12;y--;}return y+'-'+pad(m);}
function keyDays(k){return dayNum(keyStart(nextKey(k)))-dayNum(keyStart(k));}
function monthName(k){return MONTHS[+k.slice(5,7)-1];}
function monthIn(k){return MONTHS_IN[+k.slice(5,7)-1];}
function monthLabel(k){return k.slice(0,4)===curKey().slice(0,4)?monthName(k):monthName(k)+' '+k.slice(0,4);}
function inMonth(ds,k){return String(ds||'').slice(0,7)===k;}

/* ---------- computations ---------- */
function daysLeft(){return dayNum(keyStart(nextKey(curKey())))-dayNum(todayStr());}
function monthVideos(k){return S.videos.filter(function(v){return inMonth(v.date,k);});}
function monthResults(k){return S.results.filter(function(r){return inMonth(r.date,k);});}
function seasonVideos(){return monthVideos(curKey());}
function seasonResults(){return monthResults(curKey());}
function rankIdxFor(n){var idx=-1;S.settings.ranks.forEach(function(r,i){if(n>=r.videos)idx=i;});return idx;}
function rankName(i){return (S.settings.ranks[i]||{}).name||'—';}
function sums(list){return list.reduce(function(a,r){return{views:a.views+(+r.views||0),money:a.money+(+r.money||0)};},{views:0,money:0});}
function folSorted(){return S.followers.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});}
function folNow(){var p=folSorted();return p.length?p[p.length-1].count:null;}
/* followers gained within month k: last value in the month minus the last value before it (or the month's first value) */
function folGain(k){
  var p=folSorted(),inM=p.filter(function(x){return inMonth(x.date,k);});if(!inM.length)return null;
  var before=p.filter(function(x){return x.date<keyStart(k);});
  var base=before.length?before[before.length-1].count:inM[0].count;
  return inM[inM.length-1].count-base;
}
function pastMonths(){var out=[],k=S.since,ck=curKey(),g=0;while(k<ck&&g++<240){out.push(k);k=nextKey(k);}return out;}
function monthStats(k){var v=monthVideos(k).length,idx=rankIdxFor(v);return{key:k,videos:v,rankIdx:idx,views:sums(monthResults(k)).views,fol:folGain(k)};}
function pastSeasons(){return pastMonths().map(monthStats);}
function need(L){return 25*(L-1)*L;}
function lvl(xp){var L=1;while(need(L+1)<=xp)L++;return L;}
function branchXp(id){return S.skills.reduce(function(a,s){return s.branch===id?a+(S.settings.xp[s.action]||0):a;},0);}
function branchName(id){var b=BRANCHES.filter(function(x){return x.id===id;})[0];return b?b.name:'';}
function tier(L){return L<=2?'Новичок':L<=5?'Боец':L<=9?'Ветеран':L<=14?'Эксперт':'Мастер';}
function levels(){var o={};BRANCHES.forEach(function(b){o[b.id]=lvl(branchXp(b.id));});return o;}
function charLevel(){var l=levels();return Object.keys(l).reduce(function(a,k){return a+l[k];},0);}
function maxInWindow(days,len){var a=days.slice().sort(function(x,y){return x-y;});var i=0,best=0;for(var j=0;j<a.length;j++){while(a[j]-a[i]>=len)i++;best=Math.max(best,j-i+1);}return best;}
function curStreak(){var set={};S.videos.forEach(function(v){set[dayNum(v.date)]=1;});var d=dayNum(todayStr());if(!set[d])d--;var n=0;while(set[d]){n++;d--;}return n;}
function descOf(a){return typeof a.desc==='function'?a.desc():(a.desc||'');}
function allAch(){var list=ACH.concat(S.custom.map(function(c){return Object.assign({custom:true,icon:'star'},c);}));return list.map(function(a,i){return{a:a,i:i};}).sort(function(x,y){return (RARITY[x.a.r].o-RARITY[y.a.r].o)||(x.i-y.i);}).map(function(x){return x.a;});}
function computeStats(){
  var vids=S.videos.map(function(v){return dayNum(v.date);});
  var uniq=Object.keys(vids.reduce(function(o,d){o[d]=1;return o;},{})).map(Number).sort(function(a,b){return a-b;});
  var maxStreak=0,run=0,prev=null;uniq.forEach(function(d){run=(prev!==null&&d===prev+1)?run+1:1;prev=d;if(run>maxStreak)maxStreak=run;});
  var cnt={};Object.keys(ACTIONS).forEach(function(k){cnt[k]=0;});S.skills.forEach(function(s){cnt[s.action]=(cnt[s.action]||0)+1;});
  var workouts=S.skills.filter(function(s){return s.action==='workout';}).map(function(s){return dayNum(s.date);});
  var hist=pastSeasons(),n=seasonVideos().length;
  return{videosTotal:S.videos.length,maxStreak:maxStreak,max7:maxInWindow(vids,7),work30:maxInWindow(workouts,30),cnt:cnt,
    bestRank:Math.max.apply(null,[rankIdxFor(n)].concat(hist.map(function(h){return h.rankIdx;}))),
    bestViews:Math.max.apply(null,[sums(seasonResults()).views].concat(hist.map(function(h){return h.views;}))),
    bestVideos:Math.max.apply(null,[n].concat(hist.map(function(h){return h.videos;}))),
    moneyTotal:S.results.reduce(function(a,r){return a+(+r.money||0);},0),levels:levels(),seasonsDone:hist.length,
    tasksDone:S.tasks.filter(function(t){return t.done;}).length};
}
function checkAch(silent){
  var s=computeStats();var fresh=[];
  ACH.forEach(function(a){if(!S.ach[a.id]&&a.ok(s)){S.ach[a.id]=todayStr();fresh.push(a);}});
  if(!silent)fresh.forEach(function(a){queuePopup({kind:'ach',a:a});});
}
function snapshot(){return{rank:rankIdxFor(seasonVideos().length),levels:levels()};}
function mutate(fn){
  var before=snapshot();fn();var after=snapshot();
  if(after.rank>before.rank)queuePopup({kind:'rank',idx:after.rank});
  BRANCHES.forEach(function(b){if(after.levels[b.id]>before.levels[b.id])queuePopup({kind:'level',b:b,L:after.levels[b.id]});});
  checkAch(false);save();render();
}

function niceTicks(lo,hi){
  var r=hi-lo;if(r<=0)r=Math.max(10,Math.abs(hi)*0.05);
  var raw=r/3,mag=Math.pow(10,Math.floor(Math.log10(raw))),step=[1,2,5,10].map(function(m){return m*mag;}).filter(function(s){return s>=raw;})[0];

}

  var step=function(a,upto){var P=[];for(var d=0;d<=upto;d++)if(d===0||d===upto||a[d]!==a[d-1])P.push([X(d),Y(a[d])]);if(P.length<2)P.push([X(upto)+.1,Y(a[upto])]);var n=P.length,m=[],t=[];

  /* activity heatmap */

    extra='<div class="pop-reward">'+(r.reward?'<span class="eyebrow">Награда</span><br>'+esc(r.reward):'Награда за этот ранг не задана. Впиши её в настройках.')+'</div>';}
  else{color='var(--accent)';eyebrow='Уровень повышен';badgeHtml='<span class="pop-lvl">'+icon(p.b.icon,30)+'<b>'+p.L+'</b></span>';title=p.b.name;desc='Уровень '+p.L+' · '+tier(p.L);}
  return '<div class="pop-card dk" style="--pc:'+color+'" role="dialog" aria-modal="true" aria-label="'+esc(eyebrow)+'"><div class="pop-rays"></div><div class="pop-glow"></div><div class="pop-eyebrow">'+eyebrow+'</div><div class="pop-badge">'+badgeHtml+'</div><h2 class="pop-title">'+esc(title)+'</h2><p class="pop-desc">'+esc(desc)+'</p>'+(tag?'<div class="tag" style="position:relative">'+tag+'</div>':'')+extra+'<button class="btn primary wide mt" data-act="pop-ok">Принять</button></div>';
}
var toastT;
function toast(msg){els.toast.textContent=msg;els.toast.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){els.toast.hidden=true;},2400);}

/* ---------- actions ---------- */
function arm(el){
  el.dataset.armed='1';el.dataset.orig=el.innerHTML;el.textContent=el.dataset.confirm||'Точно?';el.classList.add('armed');
  setTimeout(function(){if(el.isConnected&&el.dataset.armed==='1'){el.dataset.armed='';el.innerHTML=el.dataset.orig;el.classList.remove('armed');}},4000);
}
var H={
  close:closeSheet,
  settings:function(){openSheet('settings');},
  rank:function(){go('season');},
  rating:function(){go('stats','sec-fol');},
  tab:function(el){go(el.dataset.tab);},
  'task-toggle':function(el){var t=S.tasks.filter(function(x){return x.id===el.dataset.id;})[0];if(!t)return;var c=catOf(t.cat);
    if(!t.done){mutate(function(){t.done=todayStr();if(c.id!=='other'){var sid=uid();S.skills.push({id:sid,date:t.done,branch:c.id,action:'task',title:t.text});t.skillId=sid;}});
      toast(c.id!=='other'?'+'+(S.settings.xp.task||0)+' XP · '+c.name:'Задача выполнена');}
    else{mutate(function(){t.done=null;if(t.skillId){var sid=t.skillId;S.skills=S.skills.filter(function(s){return s.id!==sid;});t.skillId=null;}});toast('Задача снова в работе');}},
  'task-filter':function(el){taskFilter=el.dataset.cat;renderTasks();},
  'task-for':function(el){closeSheet();taskCat=el.dataset.cat;go('tasks');renderTasks();var i=$('t-text');if(i)try{i.focus();}catch(e){}},
  'settings-custom':function(){openSheet('settings');var c=$('c-name');if(c)c.scrollIntoView({block:'center'});},
  branch:function(el){openSheet('branch',el.dataset.id);},
  ach:function(el){openSheet('ach',el.dataset.id);},
  'fol-set':function(){var i=document.getElementById('s-fol'),n=parseInt((i&&i.value||'').replace(/\s/g,''),10);
    if(!(n>=0)){toast('Впиши число подписчиков');return;}
    mutate(function(){setFollowersToday(S,n);});toast('Записано: '+fmt(n));if(i)i.value='';},
  'fol-range':function(el){FOL_RANGE=+el.dataset.r;renderStats();},
  'add-video':function(){openSheet('video');},
  'add-result':function(){openSheet('result');},
  pick:function(el){if(!cur)return;cur.pick=el.dataset.id;refreshSheet();var i=$('sk-title');if(i)try{i.focus({preventScroll:true});}catch(e){}},
  del:function(el){var k=el.dataset.kind,id=el.dataset.id;if(k==='custom'&&cur&&cur.kind==='ach')closeSheet();mutate(function(){S[k]=S[k].filter(function(x){return x.id!==id;});if(k==='custom')delete S.ach[id];});toast('Удалено');},
  'custom-unlock':function(el){var a=S.custom.filter(function(c){return c.id===el.dataset.id;})[0];if(!a)return;mutate(function(){S.ach[a.id]=todayStr();});queuePopup({kind:'ach',a:Object.assign({icon:'star'},a)});},
  'photo-remove':function(){S.profile.hero=null;save();render();toast('Исходный персонаж возвращён');},
  'demo-year':function(){S=demoYearState();save();closeSheet();render();toast('Демо за год загружено');},
  reset:function(){S=freshState();save();closeSheet();render();toast('Всё стёрто. Сезон «'+monthName(curKey())+'» начался');},
  'start-fresh':function(){closeSheet();S=freshState();setFollowersToday(S,FOLLOWERS_NOW);save();render();toast('Сезон «'+monthName(curKey())+'» начался');},
  'pop-ok':function(){nextPopup();}
};
var F={
  task:function(f){var fd=new FormData(f),text=String(fd.get('text')||'').trim(),cat=String(fd.get('cat')||'other');
    if(!text){toast('Впиши текст задачи');return;}
    taskCat=cat;var inp=$('t-text');if(inp)inp.value='';
    mutate(function(){S.tasks.push({id:uid(),text:text,cat:cat,created:todayStr(),done:null,skillId:null});});
    var i2=$('t-text');if(i2)try{i2.focus({preventScroll:true});}catch(e){}
    toast('Задача добавлена');},
  video:function(f){var fd=new FormData(f),date=fd.get('date')||todayStr(),title=String(fd.get('title')||'').trim();
    if(date>todayStr()){toast('Видео из будущего не засчитывается');return;}
    closeSheet();mutate(function(){S.videos.push({id:uid(),date:date,title:title});});
    toast(inMonth(date,curKey())?'Видео засчитано':'Записано в сезон «'+monthLabel(date.slice(0,7))+'»');},
  result:function(f){var fd=new FormData(f),r={id:uid(),date:fd.get('date')||todayStr(),views:parseNum(fd.get('views')),money:parseNum(fd.get('money')),note:String(fd.get('note')||'').trim()};
    var fol=parseNum(fd.get('followers')),hasR=!!(r.views||r.money);
    if(!hasR&&!fol){toast('Впиши хотя бы одно число');return;}
    if(r.date>todayStr()){toast('Дата из будущего не засчитывается');return;}
    closeSheet();
    mutate(function(){if(hasR)S.results.push(r);if(fol){S.followers=S.followers.filter(function(x){return x.date!==r.date;});S.followers.push({id:uid(),date:r.date,count:fol});}});
    toast(fol?'Рейтинг: '+fmt(folNow()):'Результаты записаны');},
  skill:function(f){var fd=new FormData(f),a=ACTIONS[fd.get('action')];if(!a)return;var title=String(fd.get('title')||'').trim();
    mutate(function(){S.skills.push({id:uid(),date:todayStr(),branch:a.branch,action:a.id,title:title});});
    toast('+'+S.settings.xp[a.id]+' XP · '+branchName(a.branch));},
  settings:function(f){var fd=new FormData(f);
    mutate(function(){
      S.profile.name=String(fd.get('name')||'').trim()||'Игрок';
      S.settings.ranks=S.settings.ranks.map(function(r,i){return{name:String(fd.get('rn'+i)||'').trim()||r.name,videos:clampInt(fd.get('rv'+i),1,999,r.videos),reward:String(fd.get('rr'+i)||'').trim()};}).sort(function(a,b){return a.videos-b.videos;});
      Object.keys(S.settings.xp).forEach(function(k){S.settings.xp[k]=clampInt(fd.get('xp_'+k),0,1000,S.settings.xp[k]);});
      S.settings.currency=String(fd.get('cur')||'').trim().slice(0,4)||'₴';
    });toast('Настройки сохранены');},
  custom:function(f){var fd=new FormData(f),name=String(fd.get('cname')||'').trim();if(!name){toast('Впиши название трофея');return;}
    mutate(function(){S.custom.push({id:'c'+uid(),name:name,desc:String(fd.get('cdesc')||'').trim(),r:fd.get('crar')||'rare'});});toast('Трофей добавлен');}
};

document.addEventListener('click',function(e){
  var tp=e.target.closest('[data-tip]');if(tp)showTip(tp);else hideTip();
  var el=e.target.closest('[data-act]');if(!el)return;
  if(el.tagName==='BUTTON'&&el.getAttribute('type')!=='submit')e.preventDefault();
  if(el.dataset.confirm!==undefined&&el.dataset.armed!=='1'){arm(el);return;}
  var fn=H[el.dataset.act];if(fn)fn(el,e);
});
document.addEventListener('submit',function(e){e.preventDefault();var f=e.target,fn=F[f.dataset.form];if(fn)fn(f);});
document.addEventListener('mouseover',function(e){var t=e.target.closest&&e.target.closest('[data-tip]');if(t)showTip(t);});
document.addEventListener('mouseout',function(e){if(e.target.closest&&e.target.closest('[data-tip]'))hideTip();});
window.addEventListener('scroll',hideTip,{passive:true});
document.addEventListener('change',function(e){if(e.target.id==='t-cat')taskCat=e.target.value;});
document.addEventListener('keydown',function(e){if(e.key!=='Escape')return;if(!els.popup.hidden)nextPopup();else if(cur)closeSheet();});
els.photo.addEventListener('change',function(){
  var file=els.photo.files&&els.photo.files[0];if(!file)return;
  var rd=new FileReader();
  rd.onload=function(){var img=new Image();
    img.onload=function(){var k=Math.min(1,768/img.width,1152/img.height),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      S.profile.hero=c.toDataURL('image/png');save();render();toast(storageOk?'Персонаж обновлён':'Изображение не сохранилось: браузеру не хватает места');};
    img.onerror=function(){toast('Не получилось открыть фото. Попробуй JPG или PNG.');};
    img.src=rd.result;};
  rd.readAsDataURL(file);els.photo.value='';
});

/* ---------- init ---------- */
var S=null;
S=load();
/* month changed since the last visit: the previous month's season is over */
var ended=null;
if(S.season.key<curKey()){ended=prevKey(curKey());S.season={key:curKey()};if(S.demo||ended<S.since)ended=null;}
checkAch(true);save();render();
if(ended)openSheet('seasonEnd',ended);
/* Instagram sync: data/followers.json is written by a scheduled GitHub Action */
function syncFollowers(){
  if(S.demo||typeof fetch!=='function')return;
  fetch('data/followers.json?'+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(arr){
    if(!arr||!arr.length)return;var changed=false;
    arr.forEach(function(p){if(!p||!/^\d{4}-\d\d-\d\d$/.test(p.date)||typeof p.count!=='number')return;
      var ex=S.followers.filter(function(x){return x.date===p.date;})[0];
      if(!ex){S.followers.push({id:uid(),date:p.date,count:p.count});changed=true;}else if(ex.count!==p.count){ex.count=p.count;changed=true;}});
    if(changed){save();render();}
  }).catch(function(){});
}
syncFollowers();
})();
</script>
